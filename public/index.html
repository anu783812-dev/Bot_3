<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Group Guard Bot</title>
  <style>
    body { font-family: sans-serif; background: #0b141a; color: #e9edef; margin: 0; padding: 20px; }
    .card { max-width: 420px; margin: 40px auto; background: #202c33; padding: 24px; border-radius: 14px; }
    h1 { font-size: 22px; margin-top: 0; }
    input, button { width: 100%; padding: 14px; font-size: 16px; border-radius: 8px; border: none; box-sizing: border-box; margin-top: 12px; }
    button { background: #00a884; color: white; font-weight: bold; }
    #code { font-size: 32px; letter-spacing: 6px; text-align: center; margin-top: 20px; color: #00a884; }
    #msg { margin-top: 12px; color: #ffb4a9; }
    ol { padding-left: 20px; line-height: 1.7; }
  </style>
</head>
